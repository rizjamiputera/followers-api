# services / containers
#
# Secrets live in .env.production on the VPS (gitignored).
# See .env.production.example for required keys.
services:
    # express app
    prod-api-followers:
        image: ghcr.io/putera-/followers-api:${API_IMAGE_TAG:-latest}
        container_name: prod-api-followers
        pull_policy: always
        restart: always
        env_file: .env.production
        ports:
            - 5333:5000
            - 5666:5555
        volumes:
            - prod_volume_api_followers:/app/public
        networks:
            - prod_followers-bicara-network
        depends_on:
            prod_followers_bicara_postgre:
                condition: service_healthy

    # postgre database
    prod_followers_bicara_postgre:
        container_name: prod_followers_bicara_postgre
        image: postgres:17.4
        env_file: .env.production
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - prod_volume_postgre_followers:/var/lib/postgresql/data
        networks:
            - prod_followers-bicara-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

# volumes
volumes:
    prod_volume_api_followers:
        name: prod_volume_api_followers
    prod_volume_postgre_followers:
        name: prod_volume_postgre_followers

# networks
networks:
    prod_followers-bicara-network:
        name: prod_followers-bicara-network
        driver: bridge
