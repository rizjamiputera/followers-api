# services / containers
services:
    # express app
    dev-api-followers:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dev-api-followers
        # image: dev-api-followers:1.1.4
        image: dev-api-followers:latest
        restart: always
        ports:
            - 5111:5000
            - 5051:5555
        environment:
            PORT: 5000
            WEB_URI: https://dev.followersbicara.com
            API_URI: https://dev-api.followersbicara.com
            JWTSECRET: FOLLOWER_FRUTTA_ID_2025
            NODE_ENV: development
            JWT_EXPIRATION: 180
            # for prisma
            DATABASE_URL: postgresql://dev_user_followers:abracadabra@followers-dev-postgre:5432/postgres?schema=followers
        volumes:
            - dev-volume-api-followers:/app/public
        networks:
            - dev-followers-bicara-network
        depends_on:
            - followers-dev-postgre

    # postgre database
    followers-dev-postgre:
        container_name: followers-dev-postgre
        image: postgres:17.4
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: dev_user_followers
            POSTGRES_PASSWORD: abracadabra
            POSTGRES_DB: postgres
        volumes:
            - volume_postgre_dev_followers:/var/lib/postgresql/data
        networks:
            - dev-followers-bicara-network
# volumes
volumes:
    dev-volume-api-followers:
        name: dev-volume-api-followers
    volume_postgre_dev_followers:
        name: volume_postgre_dev_followers

# networks
networks:
    dev-followers-bicara-network:
        name: dev-followers-bicara-network
        driver: bridge
