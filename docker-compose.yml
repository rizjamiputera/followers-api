# services / containers
services:
    # express app
    dev_api_followers:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: dev_api_followers
        image: dev_api_followers:1.1.1
        restart: always
        ports:
            - 5111:5000
            - 5051:5555
        environment:
            PORT: 5000
            WEB_URI: https://dev.followersbicara.com
            API_URI: https://dev-api.followersbicara.com
            JWTSECRET: FOLLOWER_FRUTTA_ID_2025
            NODE_ENV: development
            JWT_EXPIRATION: 180
            # for prisma
            DATABASE_URL: postgresql://dev_user_followers:abracadabra@followers_dev_postgre:5432/postgres?schema=followers
        volumes:
            - dev_volume_api_followers:/app/public
        networks:
            - dev_followers-bicara-network
        depends_on:
            - followers_dev_postgre

    # postgre database
    followers_dev_postgre:
        container_name: followers_dev_postgre
        image: postgres:17.4
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: dev_user_followers
            POSTGRES_PASSWORD: abracadabra
            POSTGRES_DB: postgres
        volumes:
            - volume_postgre_dev_followers:/var/lib/postgresql/data
        networks:
            - dev_followers-bicara-network
# volumes
volumes:
    dev_volume_api_followers:
        name: dev_volume_api_followers
    volume_postgre_dev_followers:
        name: volume_postgre_dev_followers

# networks
networks:
    dev_followers-bicara-network:
        name: dev_followers-bicara-network
        driver: bridge
