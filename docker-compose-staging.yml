# services / containers
services:
    # postgre database
    stg_followers_bicara_postgre:
        container_name: stg_followers_bicara_postgre
        image: postgres:17.4
        environment:
            POSTGRES_USER: followersBicaraDong
            POSTGRES_PASSWORD: _amburaduL
            POSTGRES_DB: postgres
        volumes:
            - stg_volume_postgre_followers:/var/lib/postgresql/data
        networks:
            - stg_followers-bicara-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # express app
    stg-api-followers:
        image: ghcr.io/putera-/followers-api:${STG_API_IMAGE_TAG:-stg-latest}
        container_name: stg-api-followers
        pull_policy: always
        restart: always
        ports:
            - 5777:5000
            - 5888:5555
        environment:
            PORT: 5000
            WEB_URI: https://stg.followersbicara.com
            API_URI: https://stg-api.followersbicara.com
            JWTSECRET: FOLLOWER_BICARA_FRUTTA_ID_2025_STAGING
            NODE_ENV: production
            JWT_EXPIRATION: 180
            # for prisma
            DATABASE_URL: postgresql://followersBicaraDong:_amburaduL@stg_followers_bicara_postgre:5432/postgres?schema=followers
            # for export pdf
            PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
            # email
            EMAIL_USER: udaputera.hostinger@gmail.com
            EMAIL_PASSWORD: bjsu zxtb kwbx toyf
            APP_NAME: Followers Bicara
        volumes:
            - stg_volume_api_followers:/app/public
        networks:
            - stg_followers-bicara-network
        depends_on:
            stg_followers_bicara_postgre:
                condition: service_healthy

# volumes
volumes:
    stg_volume_api_followers:
        name: stg_volume_api_followers
    stg_volume_postgre_followers:
        name: stg_volume_postgre_followers

# networks
networks:
    stg_followers-bicara-network:
        name: stg_followers-bicara-network
        driver: bridge
