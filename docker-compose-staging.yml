# services / containers
#
# Secrets live in .env.staging on the VPS (gitignored).
# See .env.staging.example for required keys.
services:
    # postgre database
    stg_followers_bicara_postgre:
        container_name: stg_followers_bicara_postgre
        image: postgres:17.4
        env_file: .env.staging
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - stg_volume_postgre_followers:/var/lib/postgresql/data
        networks:
            - stg_followers-bicara-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5

    # express app
    stg-api-followers:
        image: ghcr.io/rizjamiputera/followers-api:${STG_API_IMAGE_TAG:-stg-latest}
        container_name: stg-api-followers
        pull_policy: always
        restart: always
        env_file: .env.staging
        ports:
            - 5777:5000
            - 5888:5555
        volumes:
            - stg_volume_api_followers:/app/public
        networks:
            - stg_followers-bicara-network
        depends_on:
            stg_followers_bicara_postgre:
                condition: service_healthy

# volumes
volumes:
    stg_volume_api_followers:
        name: stg_volume_api_followers
    stg_volume_postgre_followers:
        name: stg_volume_postgre_followers

# networks
networks:
    stg_followers-bicara-network:
        name: stg_followers-bicara-network
        driver: bridge
