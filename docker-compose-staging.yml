# services / containers
services:
    # backup and volume copier - backs up then copies production volumes to staging
    volume-copier:
        image: alpine:latest
        container_name: stg-volume-copier
        volumes:
            - prod_volume_api_followers:/source/files:ro
            - prod_volume_postgre_followers:/source/db:ro
            - stg_volume_api_followers:/target/files
            - stg_volume_postgre_followers:/target/db
            - ./backups:/backups
        command: |
            sh -c "
            echo '💾 Creating production backup before staging copy...'
            TIMESTAMP=\$(date +%Y%m%d_%H%M%S)
            mkdir -p /backups

            echo '📁 Backing up production files...'
            tar czf /backups/prod_files_backup_\$TIMESTAMP.tar.gz -C /source/files . 2>/dev/null || echo 'No files to backup'

            echo '🗄️ Backing up production database...'
            tar czf /backups/prod_db_backup_\$TIMESTAMP.tar.gz -C /source/db . 2>/dev/null || echo 'No database to backup'

            echo '📋 Backup created: prod_files_backup_\$TIMESTAMP.tar.gz, prod_db_backup_\$TIMESTAMP.tar.gz'

            echo '📁 Copying production files to staging...'
            cp -r /source/files/* /target/files/ 2>/dev/null || echo 'No files to copy or target ready'

            echo '🗄️ Copying production database to staging...'
            cp -r /source/db/* /target/db/ 2>/dev/null || echo 'No database files to copy or target ready'

            echo '🧹 Cleaning old backups (keeping last 30 days)...'
            find /backups -name 'prod_*_backup_*.tar.gz' -mtime +30 -delete 2>/dev/null || true

            echo '✅ Backup and copy completed successfully'
            "
        networks:
            - stg_followers-bicara-network

    # postgre database
    stg_followers_bicara_postgre:
        container_name: stg_followers_bicara_postgre
        image: postgres:17.4
        environment:
            POSTGRES_USER: followersBicaraDong
            POSTGRES_PASSWORD: _amburaduL
            POSTGRES_DB: postgres
        volumes:
            - stg_volume_postgre_followers:/var/lib/postgresql/data
        networks:
            - stg_followers-bicara-network
        depends_on:
            - volume-copier

    # express app
    stg-api-followers:
        build:
            context: .
            dockerfile: Dockerfile-Production
        container_name: stg-api-followers
        # image: stg-api-followers:1.2.0
        image: stg-api-followers:latest
        restart: always
        ports:
            - 5777:5000
            - 5888:5555
        environment:
            PORT: 5000
            WEB_URI: https://stg.followersbicara.com
            API_URI: https://stg-api.followersbicara.com
            JWTSECRET: FOLLOWER_BICARA_FRUTTA_ID_2025_STAGING
            NODE_ENV: production
            JWT_EXPIRATION: 180
            # for prisma
            DATABASE_URL: postgresql://followersBicaraDong:_amburaduL@stg_followers_bicara_postgre:5432/postgres?schema=followers
        volumes:
            - stg_volume_api_followers:/app/public
        networks:
            - stg_followers-bicara-network
        depends_on:
            - stg_followers_bicara_postgre
# volumes
volumes:
    # staging volumes
    stg_volume_api_followers:
        name: stg_volume_api_followers
    stg_volume_postgre_followers:
        name: stg_volume_postgre_followers
    # production volumes (external, read-only access)
    prod_volume_api_followers:
        external: true
        name: prod_volume_api_followers
    prod_volume_postgre_followers:
        external: true
        name: prod_volume_postgre_followers

# networks
networks:
    stg_followers-bicara-network:
        name: stg_followers-bicara-network
        driver: bridge
